name: Free LinkedIn & ATS Job Discovery (4x Daily)

on:
  schedule:
    # Runs 4 times daily at 12:47 PM (~1 PM), 6:47 PM (~7 PM), 12:47 AM (~1 AM), 5:47 AM (~6 AM) IST
    # UTC: 07:17, 13:17, 19:17, 00:17 UTC
    - cron: '17 0,7,13,19 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  free-job-discovery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Free LinkedIn & ATS Job Hunter
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_JOBS_WEBHOOK_URL: ${{ secrets.DISCORD_JOBS_WEBHOOK_URL }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
        run: node scripts/search-and-queue.mjs --free-only
