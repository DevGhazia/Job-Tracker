name: Daily Job Discovery

on:
  schedule:
    # Runs 4 times a day: 9:00 AM, 3:00 PM, 9:00 PM, 3:00 AM IST (03:30, 09:30, 15:30, 21:30 UTC)
    - cron: '30 3,9,15,21 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  job-discovery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Job Hunter & Queue
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY || 'fc-b45480c48b2548219e66ab2f246e13a7' }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL || 'https://discord.com/api/webhooks/1538187452605399170/aawtOmEscp4gKcwViBrzr57u1EcAX3_hUfl0pwkmUyr02_OI_oLXSTYV7VZ34Xun9ZE2' }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
        run: node scripts/search-and-queue.mjs
