name: Daily Job Discovery

on:
  schedule:
    # Runs 5 times daily on odd minutes (:17) to bypass GitHub Actions runner queue congestion
    # 8:47 AM, 12:47 PM, 4:47 PM, 8:47 PM, 11:47 PM IST (03:17, 07:17, 11:17, 15:17, 18:17 UTC)
    - cron: '17 3,7,11,15,18 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  job-discovery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Job Hunter & Queue
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_JOBS_WEBHOOK_URL: ${{ secrets.DISCORD_JOBS_WEBHOOK_URL }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
        run: node scripts/search-and-queue.mjs
